<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Med Study Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #edf2f3;
      --surface: #ffffff;
      --ink: #15262b;
      --muted: #5b6f75;
      --line: #d3dee0;
      --accent: #0b6e78;
      --accent-ink: #ffffff;
      --accent-soft: #dceef0;
      --danger: #a63a2f;
      --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --read: "Literata", Georgia, "Times New Roman", serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0f1a1d;
        --surface: #162428;
        --ink: #e6eff0;
        --muted: #92a8ad;
        --line: #27393d;
        --accent: #4fb6c0;
        --accent-ink: #072a2e;
        --accent-soft: #1b3a3f;
        --danger: #e58a7f;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui);
      font-size: 16px;
      line-height: 1.5;
    }

    button, textarea { font: inherit; color: inherit; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
    }

    .header-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    .tagline { margin: 2px 0 0; font-size: 0.875rem; color: var(--muted); }

    .pulse { width: 96px; height: 24px; flex-shrink: 0; }
    .pulse path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.6s ease-out forwards;
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* Conversation */
    main { flex: 1; overflow-y: auto; padding: 24px 20px; }

    .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

    .welcome h2 { margin: 12px 0 6px; font-family: var(--read); font-size: 1.75rem; font-weight: 600; line-height: 1.2; }
    .welcome p { margin: 0 0 18px; color: var(--muted); max-width: 52ch; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .chip:hover { border-color: var(--accent); background: var(--accent-soft); }

    .msg { max-width: 100%; }

    .msg.user {
      align-self: flex-end;
      max-width: 85%;
      background: var(--accent-soft);
      border-radius: 14px 14px 4px 14px;
      padding: 10px 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.bot {
      border-left: 2px solid var(--accent);
      padding-left: 16px;
      font-family: var(--read);
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .msg.bot.error { border-left-color: var(--danger); color: var(--danger); font-family: var(--ui); }

    .msg.bot p { margin: 0 0 0.75em; }
    .msg.bot h4 { margin: 1em 0 0.4em; font-family: var(--ui); font-size: 1rem; }
    .msg.bot ul, .msg.bot ol { margin: 0 0 0.75em; padding-left: 1.3em; }
    .msg.bot li { margin-bottom: 0.25em; }
    .msg.bot code { background: var(--accent-soft); border-radius: 4px; padding: 1px 5px; font-size: 0.9em; }
    .msg.bot > :last-child { margin-bottom: 0; }

    .typing { display: flex; gap: 5px; padding: 6px 0 6px 18px; border-left: 2px solid var(--accent); }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); opacity: 0.35;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink { 50% { opacity: 1; } }

    /* Composer */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    }

    .composer { max-width: 760px; margin: 0 auto; }

    .row { display: flex; gap: 10px; align-items: flex-end; }

    textarea {
      flex: 1;
      resize: none;
      max-height: 160px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      line-height: 1.4;
    }
    textarea::placeholder { color: var(--muted); }

    .send {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 12px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .send:disabled { opacity: 0.5; cursor: not-allowed; }

    .note { margin: 8px 0 0; font-size: 0.8rem; color: var(--muted); }

    @media (max-width: 520px) {
      .pulse { display: none; }
      .welcome h2 { font-size: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse path { animation: none; stroke-dashoffset: 0; }
      .typing span { animation: none; opacity: 0.7; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Med Study Tutor</h1>
        <p class="tagline">Your guide to anatomy, physiology, pharmacology and more</p>
      </div>
      <svg class="pulse" viewBox="0 0 120 24" aria-hidden="true">
        <path pathLength="1" d="M0 12 H30 L36 12 L42 3 L50 21 L56 12 H78 L83 8 L88 12 H120" />
      </svg>
    </div>
  </header>

  <main id="chat">
    <div class="thread" id="thread">
      <section class="welcome" id="welcome">
        <h2>What are you studying today?</h2>
        <p>Ask a medical question, request an explanation, or get quizzed on a topic.</p>
        <div class="chips">
          <button class="chip" type="button">Explain the cardiac cycle</button>
          <button class="chip" type="button">How do beta blockers work?</button>
          <button class="chip" type="button">Type 1 vs type 2 diabetes</button>
          <button class="chip" type="button">Quiz me on the cranial nerves</button>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="composer">
      <div class="row">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a medical study question" aria-label="Your question"></textarea>
        <button class="send" id="send" type="button">Send</button>
      </div>
      <p class="note">For study only. This is not a substitute for professional medical advice.</p>
    </div>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const thread = document.getElementById("thread");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");

    const history = [];
    let isLoading = false;

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    }

    function renderMarkdown(text) {
      let html = "";
      let listType = null;

      const openList = (type) => {
        if (listType !== type) {
          closeList();
          html += `<${type}>`;
          listType = type;
        }
      };
      const closeList = () => {
        if (listType) {
          html += `</${listType}>`;
          listType = null;
        }
      };

      for (const rawLine of text.split("\n")) {
        const line = rawLine.trimEnd();
        let match;

        if ((match = line.match(/^#{1,6}\s+(.*)/))) {
          closeList();
          html += `<h4>${formatInline(match[1])}</h4>`;
        } else if ((match = line.match(/^\s*[-*]\s+(.*)/))) {
          openList("ul");
          html += `<li>${formatInline(match[1])}</li>`;
        } else if ((match = line.match(/^\s*\d+[.)]\s+(.*)/))) {
          openList("ol");
          html += `<li>${formatInline(match[1])}</li>`;
        } else if (!line.trim()) {
          closeList();
        } else {
          closeList();
          html += `<p>${formatInline(line)}</p>`;
        }
      }

      closeList();
      return html;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addMessage(role, text, isError = false) {
      const element = document.createElement("div");
      element.className = `msg ${role}${isError ? " error" : ""}`;

      if (role === "bot" && !isError) {
        element.innerHTML = renderMarkdown(text);
      } else {
        element.textContent = text;
      }

      thread.appendChild(element);
      scrollToBottom();
    }

    function showTyping() {
      const element = document.createElement("div");
      element.className = "typing";
      element.setAttribute("aria-label", "Tutor is typing");
      element.innerHTML = "<span></span><span></span><span></span>";
      thread.appendChild(element);
      scrollToBottom();
      return element;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight}px`;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isLoading) return;

      isLoading = true;
      sendButton.disabled = true;
      welcome.remove();

      addMessage("user", message);
      input.value = "";
      resizeInput();

      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history }),
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Something went wrong. Please try again.");
        }

        addMessage("bot", data.reply);
        history.push({ role: "user", text: message });
        history.push({ role: "assistant", text: data.reply });
      } catch (error) {
        addMessage("bot", error.message || "Could not reach the server. Check your connection and try again.", true);
      } finally {
        typing.remove();
        isLoading = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", () => sendMessage(input.value));

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(input.value);
      }
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => sendMessage(chip.textContent));
    });
  </script>
</body>
</html>
